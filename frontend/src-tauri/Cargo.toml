[package]
name = "pramaan-desktop"
version = "1.0.0"
description = "Pramaan — Honest NSE Backtesting Engine Desktop Terminal"
authors = ["Aayush Avinash Bankar <aayushbankar10@gmail.com>", "Meet Jayeshbhai Patel"]
license = "MIT"
repository = "https://github.com/aayushbankar/pramaan"
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3" }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.4", features = ["custom-protocol"] }
tauri-plugin-log = "2"
