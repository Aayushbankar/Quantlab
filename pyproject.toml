[build-system]
requires = ["setuptools>=68.0", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pramaan"
version = "1.0.0a1"
description = "Honest backtesting engine for Indian (NSE) equities with full statutory costs and overfitting diagnostics"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.2,<3",
    "numpy>=1.26,<2",
    "scipy>=1.17,<2",
    "yfinance>=1.7,<2",
    "matplotlib>=3.8,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1,<9",
    "pytest-cov>=5.0,<6",
    "ruff>=0.4,<1",
    "httpx>=0.28,<1",
]
api = [
    "fastapi>=0.146,<1",
    "uvicorn>=0.54,<1",
    "httpx>=0.28,<1",
]
dashboard = [
    "streamlit>=1.33,<2",
    "plotly>=5.20,<6",
]
build = [
    "python-pptx>=1.0,<2",
]

[project.scripts]
pramaan = "src.cli:main"

# ---------------------------------------------------------------------------
# Tool configuration
# ---------------------------------------------------------------------------

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "TCH"]
ignore = ["E501", "SIM102", "SIM108", "SIM105", "B904"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pyright]
include = ["src", "tests"]
exclude = ["**/node_modules", "**/__pycache__"]
pythonVersion = "3.10"
typeCheckingMode = "basic"
